<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>My IP</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color-scheme: light dark;
      --text: #20242c;
      --muted: #535d6c;
      --rule: rgba(20, 30, 40, .17);
      --button-bg: rgba(20, 30, 40, .09);
      --button-hover: rgba(20, 30, 40, .16);
      --pill-bg: rgba(65, 85, 120, .12);
      --pill-text: #344e71;
      --nl-bg: rgba(16, 120, 78, .13);
      --nl-text: #086844;
      --de-bg: rgba(175, 110, 16, .14);
      --de-text: #905608;
      --error: #b52e33;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f3f7;
        --muted: #adb6c5;
        --rule: rgba(255, 255, 255, .18);
        --button-bg: rgba(255, 255, 255, .12);
        --button-hover: rgba(255, 255, 255, .21);
        --pill-bg: rgba(145, 165, 210, .17);
        --pill-text: #c2d8fc;
        --nl-bg: rgba(22, 130, 91, .29);
        --nl-text: #9ce6c4;
        --de-bg: rgba(160, 105, 25, .29);
        --de-text: #f5d09c;
        --error: #ffa9a9;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent !important;
    }

    body {
      padding: 18px;
      color: var(--text);
    }

    .widget {
      max-width: 400px;
    }

    .head,
    .footer,
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .head {
      margin-bottom: 26px;
    }

    .heading {
      font-size: 14px;
      font-weight: 650;
    }

    .country {
      font-size: 12px;
      font-weight: 600;
      border-radius: 99px;
      padding: 6px 10px;
      background: var(--pill-bg);
      color: var(--pill-text);
    }

    .country.nl {
      background: var(--nl-bg);
      color: var(--nl-text);
    }

    .country.de {
      background: var(--de-bg);
      color: var(--de-text);
    }

    .country.changed {
      outline: 1px solid #f59e0b;
    }

    .ip {
      margin: 0 0 13px;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 700;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      min-height: 20px;
    }

    .meta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    hr {
      border: 0;
      height: 1px;
      background: var(--rule);
      margin: 24px 0 18px;
    }

    .previous {
      font-size: 12px;
      color: var(--muted);
    }

    .previous strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding-top: 5px;
      overflow-wrap: anywhere;
    }

    button {
      cursor: pointer;
      background: var(--button-bg);
      color: var(--text);
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 14px;
      min-height: 16px;
    }

    #status.error {
      color: var(--error);
    }
  </style>
</head>

<body>
  <main class="widget">
    <div class="head">
      <span class="heading">◎ My IP</span>
      <span class="country" id="country">Checking…</span>
    </div>
    <h1 class="ip" id="ip">—</h1>
    <div class="meta"><span id="isp">ISP: —</span><span id="type">—</span></div>
    <hr>
    <div class="footer">
      <div class="previous">Previous check<strong id="previous">—</strong></div>
      <button type="button" id="refresh">↻ Refresh</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const STORAGE_KEY = 'vivaldi-ip-widget-last-v1';
      const countryNames = new Intl.DisplayNames(['en'], { type: 'region' });
      const countryName = (code, fallback = 'Unknown') => {
        if (!/^[A-Z]{2}$/.test(code || '')) return fallback;
        return countryNames.of(code) || fallback;
      };
      const readPrevious = () => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
        catch { return null; }
      };
      const dateLabel = (value) => new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      async function refresh() {
        const button = $('refresh');
        button.disabled = true;
        $('status').classList.remove('error');
        $('status').textContent = 'Checking IP…';
        const previous = readPrevious();
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch(`https://ipwho.is/?_=${Date.now()}`, {
            cache: 'no-store', signal: controller.signal
          });
          if (!response.ok) throw new Error(`API returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.success === false || !data.ip) throw new Error(data.message || 'Invalid API response');
          const current = {
            ip: data.ip,
            code: (data.country_code || '').toUpperCase(),
            isp: data.connection?.isp || data.connection?.org || 'Unknown provider',
            checkedAt: Date.now()
          };
          const changedCountry = !!previous && previous.code !== current.code;
          const changedIp = !!previous && previous.ip !== current.ip;
          $('ip').textContent = current.ip;
          $('isp').textContent = `ISP: ${current.isp}`;
          $('type').textContent = current.ip.includes(':') ? 'IPv6' : 'IPv4';
          $('country').textContent = countryName(current.code, data.country || 'Unknown');
          $('country').className = 'country' + (current.code === 'NL' ? ' nl' : current.code === 'DE' ? ' de' : '') + (changedCountry ? ' changed' : '');
          $('previous').textContent = previous ? `${countryName(previous.code)} · ${previous.ip}` : 'First check';
          const change = changedCountry ? ' · Country changed!' : changedIp ? ' · IP changed' : '';
          $('status').textContent = `Checked at ${dateLabel(current.checkedAt)}${change}`;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(current)); } catch { }
        } catch (error) {
          $('status').classList.add('error');
          $('status').textContent = error.name === 'AbortError' ? 'Request timed out. Try again.' : `Error: ${error.message}`;
          if (previous && $('ip').textContent === '—') {
            $('ip').textContent = previous.ip;
            $('country').textContent = `${countryName(previous.code)} (saved)`;
            $('isp').textContent = `ISP: ${previous.isp}`;
          }
        } finally {
          clearTimeout(timeout);
          button.disabled = false;
        }
      }

      $('refresh').addEventListener('click', refresh);
      refresh();
    })();
  </script>
</body>

</html>
