<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>My IP</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color-scheme: light dark;
      --fallback-bg: #fafafa;
      --fallback-fg: #20242c;
      --bg: var(--colorBg, var(--fallback-bg));
      --fg: var(--colorFg, var(--fallback-fg));
      --muted: color-mix(in srgb, var(--fg) 68%, var(--bg));
      --rule: color-mix(in srgb, var(--fg) 16%, transparent);
      --button-bg: color-mix(in srgb, var(--fg) 9%, var(--bg));
      --button-hover: color-mix(in srgb, var(--fg) 16%, var(--bg));
      --nl-bg: rgba(22, 140, 91, .15);
      --nl-text: #086844;
      --de-bg: rgba(190, 120, 21, .16);
      --de-text: #885300;
      --error: #b52e33;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fallback-bg: #17191e;
        --fallback-fg: #f2f3f7;
        --nl-bg: rgba(22, 140, 91, .27);
        --nl-text: #9ce6c4;
        --de-bg: rgba(190, 120, 21, .27);
        --de-text: #f5d09c;
        --error: #ffa9a9;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      padding: 13px 17px 10px;
      color: var(--fg);
    }

    .widget {
      width: 100%;
    }

    .head,
    .footer,
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .head {
      margin-bottom: 32px;
    }

    .heading {
      font-size: 13px;
      font-weight: 650;
    }

    .country {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      border-radius: 99px;
      padding: 5px 9px;
      background: var(--button-bg);
      color: var(--fg);
    }

    .country.nl {
      background: var(--nl-bg);
      color: var(--nl-text);
    }

    .country.de {
      background: var(--de-bg);
      color: var(--de-text);
    }

    .country.changed {
      outline: 1px solid #d8941a;
    }

    .ip {
      margin: 0 0 6px;
      font-size: clamp(20px, 5.5vw, 27px);
      font-weight: 700;
      letter-spacing: -.7px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
      min-height: 17px;
    }

    .meta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta span:last-child {
      flex: none;
    }

    hr {
      border: 0;
      height: 1px;
      background: var(--rule);
      margin: 13px 0 11px;
    }

    .previous {
      min-width: 0;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .previous strong {
      color: var(--fg);
      font-weight: 600;
    }

    button {
      flex: none;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--fg);
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      font-size: 10px;
      color: var(--muted);
      margin-top: 7px;
      min-height: 13px;
    }

    #status.error {
      color: var(--error);
    }

    @media (max-width: 270px) {
      body {
        padding: 10px 12px;
      }

      .head {
        margin-bottom: 8px;
      }

      .previous {
        max-width: 60%;
      }
    }
  </style>
</head>

<body>
  <main class="widget">
    <div class="head">
      <span class="heading">◎ My IP</span>
      <span class="country" id="country">Checking…</span>
    </div>
    <h1 class="ip" id="ip">—</h1>
    <div class="meta"><span id="isp">ISP: —</span><span id="type">—</span></div>
    <hr>
    <div class="footer">
      <div class="previous">Prev: <strong id="previous">—</strong></div>
      <button type="button" id="refresh">↻ Refresh</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const STORAGE_KEY = 'vivaldi-ip-widget-last-v1';
      const countryNames = new Intl.DisplayNames(['en'], { type: 'region' });
      const countryName = (code, fallback = 'Unknown') => {
        if (!/^[A-Z]{2}$/.test(code || '')) return fallback;
        return countryNames.of(code) || fallback;
      };
      const readPrevious = () => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
        catch { return null; }
      };
      const dateLabel = (value) => new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      async function refresh() {
        const button = $('refresh');
        button.disabled = true;
        $('status').classList.remove('error');
        $('status').textContent = 'Checking IP…';
        const previous = readPrevious();
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch(`https://ipwho.is/?_=${Date.now()}`, {
            cache: 'no-store', signal: controller.signal
          });
          if (!response.ok) throw new Error(`API returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.success === false || !data.ip) throw new Error(data.message || 'Invalid API response');
          const current = {
            ip: data.ip,
            code: (data.country_code || '').toUpperCase(),
            isp: data.connection?.isp || data.connection?.org || 'Unknown provider',
            checkedAt: Date.now()
          };
          const changedCountry = !!previous && previous.code !== current.code;
          const changedIp = !!previous && previous.ip !== current.ip;
          $('ip').textContent = current.ip;
          $('isp').textContent = `ISP: ${current.isp}`;
          $('type').textContent = current.ip.includes(':') ? 'IPv6' : 'IPv4';
          $('country').textContent = countryName(current.code, data.country || 'Unknown');
          $('country').className = 'country' + (current.code === 'NL' ? ' nl' : current.code === 'DE' ? ' de' : '') + (changedCountry ? ' changed' : '');
          $('previous').textContent = previous ? `${countryName(previous.code)} · ${previous.ip}` : 'No earlier check';
          const change = changedCountry ? ' · Country changed!' : changedIp ? ' · IP changed' : '';
          $('status').textContent = `Checked at ${dateLabel(current.checkedAt)}${change}`;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(current)); } catch { }
        } catch (error) {
          $('status').classList.add('error');
          $('status').textContent = error.name === 'AbortError' ? 'Request timed out. Try again.' : `Error: ${error.message}`;
          if (previous && $('ip').textContent === '—') {
            $('ip').textContent = previous.ip;
            $('country').textContent = `${countryName(previous.code)} (saved)`;
            $('isp').textContent = `ISP: ${previous.isp}`;
          }
        } finally {
          clearTimeout(timeout);
          button.disabled = false;
        }
      }

      $('refresh').addEventListener('click', refresh);
      refresh();
    })();
  </script>
</body>

</html>
